spring.application.name=smartshop-erp

# ==============================
# BASE DE DONNEES
# ==============================
# La base doit etre creee au prealable avec le script sql/smartshop_db.sql
# (celui-ci cree aussi les triggers/procedures/vues que JPA ne peut pas generer)
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_db?useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Keran19
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=none : le schema est gere entierement par sql/smartshop_db.sql (triggers, procedures, vues inclus)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
# IMPORTANT (production) : remplacer par une valeur secrete forte (>= 32 caracteres aleatoires),
# injectee via variable d'environnement (ex: APP_JWT_SECRET), jamais commitee en clair.
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_super_secret_key_smartshop_erp_2026_min_32_car}
# Access token : courte duree de vie (15 min) car transporte a chaque requete
app.jwt.access-expiration-ms=900000
# Refresh token : plus longue duree de vie (7 jours), stocke hache en base, revocable
app.jwt.refresh-expiration-ms=604800000

# ==============================
# SECURITE DES COMPTES (anti-bruteforce)
# ==============================
# Nombre de tentatives de connexion echouees avant verrouillage temporaire du compte
app.securite.tentatives-max=5
# Duree du verrouillage, en minutes
app.securite.verrouillage-minutes=15

# ==============================
# CORS
# ==============================
# Liste blanche des origines autorisees a appeler l'API (jamais de wildcard "*" en production)
app.cors.origines-autorisees=${APP_CORS_ORIGINES:http://localhost:5173,http://localhost:3000}

# ==============================
# UPLOADS / FICHIERS GENERES (factures pdf)
# ==============================
app.fichiers.dossier-factures=./data/factures

# ==============================
# DIVERS
# ==============================
server.port=8080
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Africa/Douala

# ==============================
# DURCISSEMENT PRODUCTION
# ==============================
# Ne jamais exposer la stack trace ni le message brut d'exception au client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Masque l'entete "Server" / bannieres de version pour reduire le fingerprinting
server.error.whitelabel.enabled=false

# Journaux : ne pas logger les mots de passe/tokens ; niveau INFO en production
logging.level.org.springframework.security=INFO
logging.level.com.smartshop.erp=INFO
